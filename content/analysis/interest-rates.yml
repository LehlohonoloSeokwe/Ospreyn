title: 'SARB Repo Rate: From Easing to a Renewed Hike'
indicator: SARB policy repo rate (%, year-end value; MPC decisions in the secondary series)
trend: The repo rate rose from 3.50% in 2020 to a peak of 8.25% in 2023. Cuts began in September 2024 and continued through 2025, taking the rate to 6.75% after the November 2025 meeting. The direction reversed in 2026. The Monetary Policy Committee raised the rate to 7.00% in May, held it in July on a 4–2 vote in which two members wanted a hike, and on 23 September raised it unanimously to 7.25%, effective 25 September. Prime is 10.75%.
whyItMatters: The repo rate is the Reserve Bank’s main policy tool. Commercial banks set the prime lending rate at repo plus 3.5 percentage points, and prime feeds into variable-rate home loans, overdrafts and other credit. The 2026 hikes therefore raise borrowing costs after the relief of 2024–25. The Committee’s September 2026 statement sets out its reasons and its inflation outlook; read it alongside this series.
whoIsAffected: Borrowers with variable-rate debt such as home loans, vehicle finance and overdrafts; savers (deposit rates tend to follow policy rates); banks (interest margins and credit-loss risk both move with rates); National Treasury (rates affect the cost of new borrowing).
