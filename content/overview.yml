updated: October 2026
headline: 'Where the Economy Stands: October 2026'
summary: South Africa enters the final quarter of 2026 with weak growth, a rising official unemployment rate and a Reserve Bank that has moved from cutting to raising interest rates. The figures below come from the datasets on this site and from official releases; each point lists where to check it.
points:
- title: Interest rates turned up again
  text: 'The repo rate fell to 6.75% by November 2025, then rose to 7.00% in May and 7.25% in September 2026 (prime 10.75%). Source: SARB Monetary Policy Committee statements.'
- title: Slow growth and a fiscal update
  text: Real GDP grew 1.1% in 2025 (World Bank series). Treasury said in June it was reassessing growth projections because of geopolitical tensions and oil prices, and the mid-term budget was tabled on 21 October 2026. Read the MTBPS tables for official debt and deficit figures.
- title: Unemployment is rising
  text: 'Stats SA’s official rate was 33.6% in Q2 2026, up from 32.7% in Q1 and 31.4% in Q4 2025; 8.5 million people were unemployed. The broader LU3 measure was 43.8%. Source: Stats SA QLFS, 11 August 2026.'
- title: Financial integrity after the grey list
  text: The FATF removed South Africa from its grey list on 24 October 2025. Monitoring continues, and South Africa’s next FATF evaluation begins in 2026. See the policy brief for detail.
