footerBlurb: South African macroeconomic and regulatory policy dashboard with written analysis. Grounded in primary official data from the World Bank, South African Reserve Bank, Statistics South Africa, and National Treasury.
contactEmail: ''
disclaimer: Educational and policy analysis, not financial or investment advice. Data is retrieved under open license terms from public institutions and verified against official gazettes.
aboutTitle: About Ospreyn
aboutIntro: Ospreyn is an independent macroeconomic and regulatory intelligence platform for South Africa. It combines cited public data, precise time-series charts and plain-language written analysis for policy, regulatory and public affairs decision-makers in finance.
aboutCard: Independent analysis of the South African economy and its regulators. Every figure traces to a cited public source, and anything unchecked is flagged in the verification register.
